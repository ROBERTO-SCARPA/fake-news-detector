<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <header class="app-header">
            <h1 class="app-header__title">Fake News Detector</h1>
            <p class="app-header__subtitle">
                Analyze a text or URL to discover if a news article is fake or real
            </p>
            <div id="fn-user-info"></div>
        </header>

        <!-- TABS -->
        <div class="fn-tabs" role="tablist">
            <button class="fn-tab fn-tab--active"
                    id="tab-text"
                    role="tab"
                    aria-selected="true"
                    aria-controls="panel-text"
                    onclick="switchTab('text')">
                Analyze Text
            </button>
            <button class="fn-tab"
                    id="tab-url"
                    role="tab"
                    aria-selected="false"
                    aria-controls="panel-url"
                    onclick="switchTab('url')">
                Analyze URL
            </button>
        </div>

        <!-- PANEL: TESTO -->
        <div class="fn-panel fn-panel--active" id="panel-text" role="tabpanel" aria-labelledby="tab-text">
            <label class="fn-label" for="fn-news-text">
                Paste the news text to analyze
                <span class="fn-label__hint">Ctrl+Enter to submit</span>
            </label>
            <textarea id="fn-news-text"
                      placeholder="Paste the news text here..."></textarea>
            <div class="fn-word-count" id="fn-word-count">0 words</div>
            <button onclick="classifyNews()" id="fn-analyze-btn" class="fn-btn fn-btn--primary">
                Analyze Text
            </button>
        </div>

        <!-- PANEL: URL -->
        <div class="fn-panel" id="panel-url" role="tabpanel" aria-labelledby="tab-url">
            <label class="fn-label" for="fn-news-url">
                Enter the URL of the article to analyze
                <span class="fn-label__hint">Works with most news websites</span>
            </label>
            <div class="fn-url-wrapper">
                <span class="fn-url-wrapper__icon">🔗</span>
                <input type="url"
                       id="fn-news-url"
                       class="fn-url-input"
                       placeholder="https://www.example.com/news-article..."/>
            </div>
            <button onclick="scrapeAndClassify()" id="fn-scrape-btn" class="fn-btn fn-btn--primary">
                Analyze URL
            </button>
        </div>

        <!-- RISULTATO -->
        <div id="fn-result"></div>

    </div>

    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
