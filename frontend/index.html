<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <h1>🔍 Fake News Detector</h1>
        <p class="subtitle">Analizza il testo di una news per verificare se è fake o reale</p>

        <div id="fn-user-info"></div>

        <label for="fn-news-text">Inserisci il testo della news:</label>
        <textarea id="fn-news-text"
                  placeholder="Copia e incolla qui il testo della news che vuoi analizzare..."></textarea>
 
        <button onclick="classifyNews()" id="fn-analyze-btn">Analizza Testo</button>

        <div id="fn-result"></div>

    </div>

    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"
            crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <script src="app.js"></script>
</body>
</html>
