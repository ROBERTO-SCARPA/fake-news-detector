    <header class="fn-navbar fixed top-0 w-full z-50">
        <div class="flex items-center justify-between px-6 py-4 max-w-7xl mx-auto">

            <nav class="hidden md:flex items-center space-x-8">
                <a class="font-label text-blue-700 font-bold border-b-2 border-blue-700 pb-1" href="index.html">Home</a>
