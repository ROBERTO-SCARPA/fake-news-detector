name: Deploy Static Website to Azure Blob

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload frontend to Azure Blob $web
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload-batch --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" --source ./frontend --destination '$web' --overwrite true
