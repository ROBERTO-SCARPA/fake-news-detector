name: Deploy Azure Function App (Python)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # ← Cambiato da 3.12.7 a 3.11

      - name: Deploy to Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: func-fakenews-api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: backend
          scm-do-build-during-deployment: true  # ← AGGIUNTO: Remote build
          enable-oryx-build: true                # ← AGGIUNTO: Usa Oryx builder
